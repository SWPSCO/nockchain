name: Nockchain SLSA3 release

on:
  repository_dispatch:
    types: [build-master]
  workflow_dispatch:
    inputs:
      create_release:
        description: "create github release when manually triggered"
        required: false
        default: true
        type: boolean

permissions: write-all
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.set.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: master
      - name: set short git commit sha
        id: set
        run: |
          calculatedSha=$(git rev-parse master | cut -c1-7)
          echo "short_sha=$calculatedSha" >> $GITHUB_OUTPUT

  build-linux-x64:
    needs: vars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: master
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          targets: x86_64-unknown-linux-gnu
      - name: Configure Git fetch with CLI
        run: |
          mkdir -p ~/.cargo
          echo '[net]' >> ~/.cargo/config.toml
          echo 'git-fetch-with-cli = true' >> ~/.cargo/config.toml
      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential musl-tools
          mkdir -p hoon
          mkdir -p assets
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          cp .env_example .env
      - name: install choo
        run: |
          cargo install --target x86_64-unknown-linux-musl --locked --force --path crates/hoonc --bin hoonc
      - name: build hoon assets
        run: make build-hoon-all
      - name: build nockchain
        run: |
          cargo install --target x86_64-unknown-linux-musl --locked --force --path crates/nockchain --bin nockchain
      - name: build wallet
        run: |
          cargo install --target x86_64-unknown-linux-musl --locked --force --path crates/nockchain-wallet --bin nockchain-wallet
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts-x64
          path: |
            assets/*.jam
            target/x86_64-unknown-linux-musl/release/nockchain
            target/x86_64-unknown-linux-musl/release/hoonc
            target/x86_64-unknown-linux-musl/release/nockchain-wallet

  build-macos:
    needs: vars
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v3
        with: { ref: master }
      - uses: actions-rs/toolchain@v1
        with: { toolchain: stable, profile: minimal }
      - name: env
        run: cp .env_example .env
      - name: build
        run: |
          make install-hoonc
          make build
          make install-nockchain
          make install-nockchain-wallet
      - name: import certs
        env:
          APPLE_P12: ${{ secrets.APPLE_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12 }} 
          APPLE_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_P12" | base64 --decode > cert.p12
          
          # Use unique keychain name for self-hosted runners
          KEYCHAIN_NAME="build-${{ github.run_id }}.keychain"
          
          # Clean up any existing keychain
          security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true
          
          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | sed s/\"//g)
          security set-keychain-settings -t 3600 -l "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          # Import certificate with proper permissions
          security import cert.p12 -k "$KEYCHAIN_NAME" -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign:,security: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          # Set as default for this session
          security default-keychain -s "$KEYCHAIN_NAME"
          
          # Verify the identity is available
          security find-identity -v -p codesigning "$KEYCHAIN_NAME"
          
          rm cert.p12
          
          # Import installer certificate
          echo "$APPLE_INSTALLER_P12" | base64 --decode > installer.p12
          security import installer.p12 -k "$KEYCHAIN_NAME" \
            -P "$APPLE_INSTALLER_P12_PASSWORD" \
            -T /usr/bin/productsign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,security: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          rm installer.p12
          
          # Set environment variable for subsequent steps
          echo "KEYCHAIN_NAME=$KEYCHAIN_NAME" >> $GITHUB_ENV

      - name: debug keychain and signing
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "=== Keychain Debug ==="
          echo "KEYCHAIN_NAME: $KEYCHAIN_NAME"
          security list-keychains
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security find-identity -v "$KEYCHAIN_NAME"
          echo "=== Codesign identities ==="
          security find-identity -v -p codesigning
      - name: codesign bins
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Ensure keychain is unlocked before signing
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          cat > "Entitlements.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-executable-page-protection</key>
              <true/>
              <key>com.apple.security.cs.allow-dyld-environment-variables</key>
              <true/>
          </dict>
          </plist>
          EOF
          for b in nockchain nockchain-wallet; do
            codesign --force --options runtime --entitlements ./Entitlements.plist --timestamp \
              --sign "Developer ID Application: Southwestern Pool Supply CO INC (484J85QW9N)" \
              --keychain "$KEYCHAIN_NAME" \
              target/release/$b
          done
      - name: build & notarize installer pkgs
        env:
          AC_API_KEY_ID:     ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID:  ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_PATH:   ${{ secrets.AC_API_KEY_PATH }}
          TEAM_ID:           484J85QW9N
        run: |
          echo "$AC_API_KEY_PATH" | base64 --decode > key.p8
          wget -qO logo_1024.png https://bin.aeroe.io/nclogo_1024.png
          mkdir icon.iconset
          for s in 16 32 64 128 256 512 1024; do
            sips -z $s $s logo_1024.png --out icon.iconset/icon_${s}x${s}.png
          done
          iconutil -c icns icon.iconset -o icon.icns
          rm -rf icon.iconset logo_1024.png
          mkdir -p dist pkgroot
          for b in nockchain nockchain-wallet; do
            rm -rf pkgroot
            mkdir -p \
              pkgroot/usr/local/bin \
              "pkgroot/Applications/$b Installer.app/Contents/MacOS" \
              "pkgroot/Applications/$b Installer.app/Contents/Resources"
            cp target/release/$b pkgroot/usr/local/bin/
            cp icon.icns "pkgroot/Applications/$b Installer.app/Contents/Resources/"
            cat > "pkgroot/Applications/$b Installer.app/Contents/MacOS/install" <<EOF
          #!/usr/bin/env bash
          osascript -e 'tell application "Terminal" to do script "$b --help"'
          EOF
            chmod +x "pkgroot/Applications/$b Installer.app/Contents/MacOS/install"
            # Info.plist
            cat > "pkgroot/Applications/$b Installer.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>$b Installer</string>
            <key>CFBundleExecutable</key><string>install</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          EOF
            pkgbuild --root pkgroot \
                     --identifier io.swps.$b.pkg \
                     --version ${{ needs.vars.outputs.short_sha }} \
                     --install-location / \
                     "$b"-unsigned.pkg
            productsign --sign "Developer ID Installer: Southwestern Pool Supply CO INC (484J85QW9N)" \
                        "$b"-unsigned.pkg "dist/$b.pkg"
            xcrun notarytool submit "dist/$b.pkg" \
                 --key key.p8 --key-id "$AC_API_KEY_ID" \
                 --issuer "$AC_API_ISSUER_ID" --team-id "$TEAM_ID" --wait
            xcrun stapler staple "dist/$b.pkg"
          done
          rm -rf key.p8 pkgroot icon.icns
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.pkg

  package:
    needs: [build-linux-x64, build-macos ]
    runs-on: ubuntu-latest
    outputs:
      content_hashes: ${{ steps.content-hash.outputs.content_hashes }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-artifacts-x64
          path: ./linux_x64
      - uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: ./mac
      - name: make zips
        run: |
          mkdir -p out/linux_x64 out/jams
          cp linux_x64/target/x86_64-unknown-linux-musl/release/{nockchain,hoonc,nockchain-wallet} out/linux_x64/
          chmod +x out/linux_x64/*
          cp linux_x64/assets/*.jam out/jams/
          (cd out/linux_x64 && zip -j ../nockchain_linux_x64.zip *)
          (cd out/jams && zip -j ../nockchain_jams.zip *)
          cp mac/nockchain.pkg out/nockchain_macos_aarch64.pkg
          cp mac/nockchain-wallet.pkg out/nockchain_wallet_macos_aarch64.pkg
      - name: compute content hashes
        id: content-hash
        run: |
          mkdir -p tmp/linux tmp/jams tmp/macos
          unzip -j out/nockchain_linux_x64.zip -d tmp/linux
          unzip -j out/nockchain_jams.zip -d tmp/jams
          cp out/nockchain_macos_aarch64.pkg tmp/macos/
          cp out/nockchain_wallet_macos_aarch64.pkg tmp/macos/
          files=$(ls tmp/linux/* tmp/jams/* tmp/macos/*)
          echo "content_hashes=$(sha256sum $files | base64 -w0)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-artifacts
          path: |
            out/nockchain_linux_x64.zip
            out/nockchain_macos_aarch64.pkg
            out/nockchain_wallet_macos_aarch64.pkg
            out/nockchain_jams.zip

  provenance:
    needs: package
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    permissions:
      actions: read
      id-token: write
      contents: write
    with:
      base64-subjects: ${{ needs.package.outputs.content_hashes }}
      upload-assets: false

  release:
    if: |
      (github.event_name == 'repository_dispatch' && github.event.action == 'build-master') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    needs: [vars, package, provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaged-artifacts
          path: ./out
      - name: download provenance
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: ./prov
      - name: Create readme
        run: |
          cat << EOF > ./README.md
          ## Verification
          
          All artifacts in the zip files have [SLSA level 3](https://github.blog/security/supply-chain-security/slsa-3-compliance-with-github-actions/) provenance attestation; simply put, this means that you can prove nobody messed with the builds and introduced some funny business. But attestation doesn't mean anything if you don't actually verify it!
          
          ### How to verify
          
          - Get the slsa3-verifier for your platform: https://github.com/slsa-framework/slsa-verifier
          - Download and unzip the release; download the `multiple.into.jsonl` file attached to the release
          - Run it against an unzipped artifact: `slsa-verifier-linux-amd64 verify-artifact nockchain-wallet --provenance-path multiple.intoto.jsonl --source-uri=git+https://github.com/SWPSCO/nockchain`
          - You should see output like this:
          ```
          Verified build using builder "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0" at commit 1f8a1deb820b1e68c908ecf60ffcc1c86ae351f8
          Verifying artifact nockchain-wallet: PASSED
          
          PASSED: SLSA verification passed
          ```
          
          Note that the hash will correspond with a commit in the `release` branch, not the commit hash that was actually built (which is what the release is named after). This is because we have to sync master from upstream and build from a separate default branch.
          
          ## MacOS notes
          
          This only includes builds for aarch64 (Apple Silicon).
          
          ## Linux notes
          
          These binaries are statically linked musl builds for x64. They should run on any x64 linux machine.
          EOF
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.vars.outputs.short_sha }}
          name: Release ${{ needs.vars.outputs.short_sha }}
          draft: false
          files: |
            out/nockchain_linux_x64.zip
            out/nockchain_macos_aarch64.pkg
            out/nockchain_wallet_macos_aarch64.pkg
            out/nockchain_jams.zip
            prov/${{ needs.provenance.outputs.provenance-name }}
            ./README.md
      - name: rename file
        run: |
          cp ./out/nockchain_linux_x64.zip ./out/nockchain.zip
      - uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET_NAME }}
          source-dir: out
          destination-dir: ./
