name: Nockchain Docker image

on:
  repository_dispatch:
    types: [build-master]
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: "Upstream nockchain commit/ref to build (defaults to master)"
        required: false
        type: string
      image_tag:
        description: "Optional extra Docker tag to push (tag name only)"
        required: false
        type: string

jobs:
  vars:
    runs-on: ['self-hosted', 'Linux', 'X64']
    outputs:
      short_sha: ${{ steps.set.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: master
      - name: set short git commit sha
        id: set
        run: |
          calculatedSha=$(git rev-parse master | cut -c1-7)
          echo "short_sha=$calculatedSha" >> $GITHUB_OUTPUT
  build:
    needs: vars
    runs-on: ['self-hosted', 'Linux', 'X64']
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        ref: master
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Dockerhub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Resolve build inputs
      id: vars
      env:
        REQUESTED_UPSTREAM_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_commit || github.event.client_payload.upstream_commit || '' }}
        REQUESTED_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.client_payload.image_tag || '' }}
      run: |
        upstream_ref=$(printf '%s' "$REQUESTED_UPSTREAM_REF" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        image_tag=$(printf '%s' "$REQUESTED_IMAGE_TAG" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        upstream_ref="${upstream_ref:-master}"

        if [ -n "$image_tag" ] && ! echo "$image_tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
          echo "Invalid Docker tag: $image_tag" >&2
          echo "Use only letters, numbers, underscores, periods, and dashes; tag must not start with a period or dash." >&2
          exit 1
        fi

        if echo "$upstream_ref" | grep -Eq '^[0-9a-fA-F]{40}$'; then
          hash="$upstream_ref"
        else
          hash=$(
            git ls-remote https://github.com/nockchain/nockchain.git \
              "$upstream_ref" \
              "refs/heads/$upstream_ref" \
              "refs/tags/$upstream_ref" |
              awk '$2 ~ /\^\{\}$/ { peeled=$1 } NR == 1 { first=$1 } END { print peeled ? peeled : first }'
          )
          if [ -z "$hash" ]; then
            hash=$(curl -fsSL "https://api.github.com/repos/nockchain/nockchain/commits/$upstream_ref" | jq -r '.sha // empty' || true)
          fi
        fi

        if [ -z "$hash" ]; then
          echo "Unable to resolve upstream ref: $upstream_ref" >&2
          exit 1
        fi

        echo "hash=$hash" >> $GITHUB_OUTPUT
        echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT
        echo "build_date=$(date)" >> $GITHUB_OUTPUT
        {
          echo "image_tags<<EOF"
          echo "swpsco/nockchain:latest"
          echo "swpsco/nockchain:$hash"
          if [ -n "$image_tag" ]; then
            echo "swpsco/nockchain:$image_tag"
          fi
          echo "EOF"
        } >> $GITHUB_OUTPUT
        
    - name: Create Dockerfile
      run: |
        cat << 'EOF' > Dockerfile
        FROM rust:1.87-slim-bullseye as builder
        ARG BUILD_LABEL="production"
        ARG BUILD_HOST
        ARG BUILD_USER
        ARG BUILD_TIMESTAMP
        ARG BUILD_DATE
        ENV BUILD_LABEL=${BUILD_LABEL}
        ENV BUILD_HOST=${BUILD_HOST}
        ENV BUILD_USER=${BUILD_USER}
        ENV BUILD_TIMESTAMP=${BUILD_TIMESTAMP}
        ENV BUILD_DATE=${BUILD_DATE}
        ARG UPSTREAM_COMMIT=master
        RUN apt-get update && apt-get install -y \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            musl-tools \
            git \
            pkg-config \
            unzip \
            curl \
            && rm -rf /var/lib/apt/lists/*
        RUN curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v30.2/protoc-30.2-linux-x86_64.zip && \
            unzip protoc-30.2-linux-x86_64.zip -d /usr/local && \
            rm protoc-30.2-linux-x86_64.zip
        WORKDIR /build
        RUN git clone https://github.com/nockchain/nockchain.git . && \
            (git fetch --tags origin "${UPSTREAM_COMMIT}" || true) && \
            git checkout "${UPSTREAM_COMMIT}"
        RUN rustup target add x86_64-unknown-linux-gnu
        RUN mkdir -p ~/.cargo && \
            echo '[net]' >> ~/.cargo/config.toml && \
            echo 'git-fetch-with-cli = true' >> ~/.cargo/config.toml
        RUN mkdir -p hoon assets
        RUN cp .env_example .env
        RUN cargo install --target x86_64-unknown-linux-gnu --locked --force --path crates/hoonc --bin hoonc
        RUN make build-hoon-all
        RUN cargo build --release --locked --target x86_64-unknown-linux-gnu --bin nockchain
        RUN cargo build --release --locked --target x86_64-unknown-linux-gnu \
            -p ai-pow-miner --features node --bin ai-pow-mine
        RUN cargo build --release --locked --target x86_64-unknown-linux-gnu \
            -p zk-pow-miner --bin zk-pow-mine
        FROM debian:bullseye-slim
        WORKDIR /nc
        RUN apt-get update && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/*
        COPY --from=builder /build/target/x86_64-unknown-linux-gnu/release/nockchain /usr/local/bin/nockchain
        COPY --from=builder /build/target/x86_64-unknown-linux-gnu/release/ai-pow-mine /usr/local/bin/ai-pow-mine
        COPY --from=builder /build/target/x86_64-unknown-linux-gnu/release/zk-pow-mine /usr/local/bin/zk-pow-mine
        RUN nockchain --version && ai-pow-mine --version && zk-pow-mine --version
        ENTRYPOINT ["/usr/local/bin/nockchain"]
        EOF
        
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.vars.outputs.image_tags }}
        build-args: |
          BUILD_HOST=SWPSCoCI
          BUILD_USER=SWPS
          BUILD_TIMESTAMP=${{ steps.vars.outputs.timestamp }}
          BUILD_DATE=${{ steps.vars.outputs.build_date }}
          UPSTREAM_COMMIT=${{ steps.vars.outputs.hash }}
        no-cache: true
